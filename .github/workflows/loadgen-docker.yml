name: Loadgen Docker Image

# Builds the `loadgen` target of etc/docker/Dockerfile.rust-services for amd64
# and arm64 on native runners, then merges both digests into one manifest.
# Pull requests only build; pushes to main, tags and manual runs publish to GHCR.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'bin/load-tester/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'etc/docker/Dockerfile.rust-services'
      - 'etc/docker/docker-bake.hcl'
      - '.github/workflows/loadgen-docker.yml'
  pull_request:
    paths:
      - 'bin/load-tester/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'etc/docker/Dockerfile.rust-services'
      - 'etc/docker/docker-bake.hcl'
      - '.github/workflows/loadgen-docker.yml'
  workflow_dispatch:

concurrency:
  group: loadgen-docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TARGET: loadgen

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - arch: linux/amd64
            runs-on: ubuntu-24.04-8core
          - arch: linux/arm64
            runs-on: ubuntu-24.04-8core-arm

    runs-on: ${{ matrix.settings.runs-on }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Prepare
        run: |
          platform="${{ matrix.settings.arch }}"
          echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loadgen" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PUSH=false" >> "$GITHUB_ENV"
          else
            echo "PUSH=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          PROFILE: release
        run: |
          if [[ "$PUSH" == "true" ]]; then
            output="type=image,push-by-digest=true,name-canonical=true,push=true"
          else
            output="type=cacheonly"
          fi
          docker buildx bake -f etc/docker/docker-bake.hcl "$TARGET" \
            --set "${TARGET}.tags=${REGISTRY_IMAGE}" \
            --set "${TARGET}.platform=${{ matrix.settings.arch }}" \
            --set "${TARGET}.output=${output}" \
            --set "${TARGET}.cache-from=type=gha,scope=loadgen-${PLATFORM_PAIR}" \
            --set "${TARGET}.cache-to=type=gha,mode=max,scope=loadgen-${PLATFORM_PAIR}" \
            --set "${TARGET}.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --set "${TARGET}.labels.org.opencontainers.image.revision=${{ github.sha }}" \
            --set "${TARGET}.labels.org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --metadata-file "${{ runner.temp }}/metadata.json"

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="$(jq -er --arg t "$TARGET" '.[$t]."containerimage.digest"' "${{ runner.temp }}/metadata.json")"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-loadgen-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Prepare
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loadgen" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-loadgen-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Create manifest list and push
        run: |
          set -euo pipefail

          tags=("${REGISTRY_IMAGE}:sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags+=("${REGISTRY_IMAGE}:${GITHUB_REF_NAME}")
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            tags+=("${REGISTRY_IMAGE}:main" "${REGISTRY_IMAGE}:latest")
          else
            tags+=("${REGISTRY_IMAGE}:${GITHUB_REF_NAME//[^a-zA-Z0-9._-]/-}")
          fi

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "$tag")
          done

          sources=()
          for digest in "${{ runner.temp }}"/digests/*; do
            sources+=("${REGISTRY_IMAGE}@sha256:${digest##*/}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"

          {
            echo "## Loadgen image published"
            echo ""
            echo '```bash'
            for tag in "${tags[@]}"; do
              echo "docker pull ${tag}"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
